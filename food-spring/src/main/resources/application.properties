# 应用服务 WEB 访问端口
server.port=8080

Mybatis-plus.mapper-locations=classpath*:/mapper/*.xml
#支持将执行的sql语句输出到控制台，便于观察对数据库的操作
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
spring.datasource.url=jdbc:mysql://localhost:3306/weixin?serverTimezone=UTC&rewriteBatchedStatements=true
spring.datasource.username=
spring.datasource.password=

server.servlet.session.timeout=3600

# 图片资源目录，相对于应用启动时的工作目录（默认指向项目内置的 img/ 目录）
# 对应 WebConfig 中的映射：/static/** -> defaultImagesDir，/images/** -> foodImagesDir
# 部署到其他环境时改为实际绝对路径即可，注意路径必须以 / 结尾
defaultImagesDir=./img/images/static/
foodImagesDir=./img/images/static/uploads/images/

host=http://localhost:8080

